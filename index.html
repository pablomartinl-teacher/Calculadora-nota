<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora | Dibujo Técnico</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-out' },
                    keyframes: { fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } }
                }
            }
        }
    </script>
    <style>
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen selection:bg-indigo-200 selection:text-indigo-900 p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        
        <!-- Cabecera -->
        <header class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-4 animate-fade-in">
            <div>
                <div class="flex items-center gap-3 mb-2">
                    <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900">
                        Calculadora nota <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-violet-500">LOMLOE</span>
                    </h1>
                    <span id="badge-alumno" class="hidden bg-emerald-500 text-white text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-widest mt-2">Modo Alumno</span>
                </div>
                <p class="text-slate-500 font-medium" id="subtitulo-header">      </p>
            </div>
            
            <!-- Botón Generar Enlace (Solo visible para el profesor) -->
            <button id="btn-compartir" onclick="generarEnlaceAlumno()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 px-4 py-2.5 rounded-xl text-sm font-bold transition-all duration-200 shadow-sm flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                Generar Enlace para Alumnos
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
            
            <!-- COLUMNA 1: Criterios -->
            <div class="lg:col-span-3 space-y-4 animate-fade-in" style="animation-delay: 0.1s;">
                <div class="flex justify-between items-center bg-white px-5 py-4 rounded-2xl shadow-sm border border-slate-100">
                    <h2 class="font-bold text-slate-800">1. Criterios Oficiales</h2>
                    <button id="btn-add-crit" onclick="addCriterio()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-lg text-sm font-semibold transition-colors duration-200 shadow-sm">+ Añadir</button>
                </div>
                <div id="lista-criterios" class="space-y-3"></div>
                <div class="bg-white/60 px-4 py-3 rounded-xl border border-slate-200/60 text-right">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Currículo:</span>
                    <span id="suma-criterios" class="ml-2 font-bold text-indigo-600">0%</span>
                </div>
            </div>

            <!-- COLUMNA 2: Instrumentos y Notas -->
            <div class="lg:col-span-4 space-y-4 animate-fade-in" style="animation-delay: 0.2s;">
                <div class="flex justify-between items-center bg-white px-5 py-4 rounded-2xl shadow-sm border border-slate-100">
                    <h2 class="font-bold text-slate-800">2. Instrumentos y Notas</h2>
                    <button id="btn-add-inst" onclick="addInstrumento()" class="bg-violet-50 hover:bg-violet-100 text-violet-600 px-3 py-1.5 rounded-lg text-sm font-semibold transition-colors duration-200 shadow-sm">+ Añadir</button>
                </div>
                <div id="lista-instrumentos" class="space-y-4"></div>
            </div>

            <!-- COLUMNA 3: Resultados -->
            <div class="lg:col-span-5 sticky top-8 animate-fade-in" style="animation-delay: 0.3s;">
                <div class="bg-slate-900 rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[calc(100vh-4rem)] max-h-[850px] border border-slate-800">
                    <div class="bg-gradient-to-br from-indigo-600 to-violet-700 p-8 text-center relative overflow-hidden">
                        <div class="absolute -top-10 -right-10 w-40 h-40 bg-white opacity-5 rounded-full blur-2xl"></div>
                        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-white opacity-10 rounded-full blur-2xl"></div>
                        
                        <h2 class="text-indigo-100 text-xs font-bold uppercase tracking-widest mb-2 relative z-10">Nota Final Continua</h2>
                        <div id="nota-final" class="text-7xl font-black text-white tracking-tighter drop-shadow-md relative z-10">0.00</div>
                        <div class="mt-4 inline-block bg-white/20 backdrop-blur-sm px-4 py-1.5 rounded-full border border-white/20 relative z-10">
                            <span class="text-xs text-indigo-50 font-medium">Proyectada sobre el <span id="techo-evaluado" class="font-bold text-white">0%</span> de los criterios</span>
                        </div>
                    </div>
                    <div class="p-6 flex-grow overflow-y-auto bg-slate-900">
                        <div class="flex items-center gap-2 mb-4">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Auditoría Criterial</h3>
                        </div>
                        <div id="explicacion-box" class="space-y-3"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 1. ESTADO DE LA APLICACIÓN
        let isStudentMode = false;
        
        let criterios = [
            { id: 'c1', nombre: "1.1", peso: 1.0 },
            { id: 'c2', nombre: "2.1", peso: 15.0 },
            { id: 'c3', nombre: "2.2", peso: 10.0 },
            { id: 'c4', nombre: "3.5", peso: 15.0 }
        ];

        let instrumentos = [
            { id: 'i1', nombre: "Láminas", peso: 20, crits: ['c2', 'c3', 'c4'], nota: 8.0 },
            { id: 'i2', nombre: "Examen Parcial", peso: 30, crits: ['c2', 'c3', 'c4'], nota: 6.0 },
            { id: 'i3', nombre: "Examen Global", peso: 40, crits: ['c1', 'c2', 'c3', 'c4'], nota: 6.5 },
            { id: 'i4', nombre: "Cuaderno", peso: 10, crits: ['c1', 'c2', 'c3', 'c4'], nota: 9.0 }
        ];

        // 2. INICIALIZACIÓN Y ENCRIPTADO (URL MÁGICA)
        function inicializar() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('modo') === 'alumno') {
                isStudentMode = true;
                document.getElementById('btn-compartir').classList.add('hidden');
                document.getElementById('btn-add-crit').classList.add('hidden');
                document.getElementById('btn-add-inst').classList.add('hidden');
                document.getElementById('badge-alumno').classList.remove('hidden');
                document.getElementById('subtitulo-header').textContent = "Simula tus calificaciones basándote en la configuración de tu profesor.";
            }

            if (window.location.hash) {
                try {
                    // Desencriptar datos de la URL
                    const data = JSON.parse(decodeURIComponent(atob(window.location.hash.substring(1))));
                    if (data.c) criterios = data.c;
                    if (data.i) {
                        // Si es un alumno, limpiamos las notas predefinidas para que simule desde cero
                        instrumentos = isStudentMode ? data.i.map(inst => ({...inst, nota: ''})) : data.i;
                    }
                } catch(e) { console.error("Enlace no válido o corrupto."); }
            }
            actualizarUI();
        }

        function generarEnlaceAlumno() {
            const data = { c: criterios, i: instrumentos };
            // Cifrado ligero a Base64 para ocultar los datos en la URL
            const hash = btoa(encodeURIComponent(JSON.stringify(data)));
            const url = window.location.origin + window.location.pathname + "?modo=alumno#" + hash;
            
            navigator.clipboard.writeText(url).then(() => {
                const btn = document.getElementById('btn-compartir');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '✓ ¡Enlace copiado al portapapeles!';
                btn.classList.replace('bg-indigo-50', 'bg-emerald-500');
                btn.classList.replace('text-indigo-600', 'text-white');
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.classList.replace('bg-emerald-500', 'bg-indigo-50');
                    btn.classList.replace('text-white', 'text-indigo-600');
                }, 3000);
            });
        }

        // 3. CONTROLADORES
        function generateId() { return Math.random().toString(36).substr(2, 9); }
        function addCriterio() { if(isStudentMode) return; criterios.push({ id: generateId(), nombre: "", peso: 5.0 }); actualizarUI(); }
        function updateCritName(id, val) { if(isStudentMode) return; criterios.find(c => c.id === id).nombre = val; actualizarUI(); }
        function updateCritPeso(id, val) { if(isStudentMode) return; criterios.find(c => c.id === id).peso = parseFloat(val) || 0; calcularNotas(); }
        function deleteCriterio(id) { 
            if(isStudentMode) return;
            criterios = criterios.filter(c => c.id !== id);
            instrumentos.forEach(inst => inst.crits = inst.crits.filter(cId => cId !== id));
            actualizarUI(); 
        }

        function addInstrumento() { if(isStudentMode) return; instrumentos.push({ id: generateId(), nombre: "Nueva Prueba", peso: 10, crits: [], nota: '' }); actualizarUI(); }
        function updateInstName(id, val) { if(isStudentMode) return; instrumentos.find(i => i.id === id).nombre = val; calcularNotas(); }
        function updateInstPeso(id, val) { if(isStudentMode) return; instrumentos.find(i => i.id === id).peso = parseFloat(val) || 0; calcularNotas(); }
        // La nota SÍ se puede actualizar en modo alumno
        function updateInstNota(id, val) { instrumentos.find(i => i.id === id).nota = val; calcularNotas(); }
        function toggleInstCrit(instId, critId) {
            if(isStudentMode) return;
            const inst = instrumentos.find(i => i.id === instId);
            if (inst.crits.includes(critId)) inst.crits = inst.crits.filter(c => c !== critId);
            else inst.crits.push(critId);
            actualizarUI();
        }
        function deleteInstrumento(id) { if(isStudentMode) return; instrumentos = instrumentos.filter(i => i.id !== id); actualizarUI(); }

        // 4. RENDERIZADO UI
        function actualizarUI() {
            criterios.sort((a, b) => a.nombre.localeCompare(b.nombre, undefined, { numeric: true, sensitivity: 'base' }));
            renderCriterios();
            renderInstrumentos();
            calcularNotas();
        }

        function renderCriterios() {
            const cssInput = isStudentMode ? "pointer-events-none bg-transparent" : "bg-slate-50 focus:bg-white focus:ring-2 focus:border-indigo-300";
            
            const html = criterios.map(c => `
                <div class="group flex items-center gap-3 bg-white p-3 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-indigo-500"></div>
                    <span class="font-bold text-slate-400 text-xs ml-2">CE</span>
                    
                    <input type="text" value="${c.nombre}" onchange="updateCritName('${c.id}', this.value)" placeholder="Ej. 1.1"
                        ${isStudentMode ? 'readonly' : ''}
                        class="w-16 p-1.5 rounded-md text-sm text-center font-bold text-slate-700 border border-transparent outline-none transition-all ${cssInput}">
                    
                    <div class="ml-auto flex items-center gap-1 p-1 rounded-md border border-slate-100 ${isStudentMode ? 'bg-transparent border-transparent' : 'bg-slate-50'}">
                        <input type="number" step="0.1" value="${c.peso}" oninput="updateCritPeso('${c.id}', this.value)" 
                            ${isStudentMode ? 'readonly' : ''}
                            class="w-14 bg-transparent p-1 text-sm text-center font-semibold text-slate-700 outline-none ${isStudentMode ? 'pointer-events-none' : ''}">
                        <span class="text-slate-400 text-xs font-bold pr-1">%</span>
                    </div>
                    
                    <button onclick="deleteCriterio('${c.id}')" class="${isStudentMode ? 'hidden' : ''} text-slate-300 hover:text-red-500 hover:bg-red-50 p-1.5 rounded-md transition-colors opacity-0 group-hover:opacity-100">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            `).join('');
            document.getElementById('lista-criterios').innerHTML = html;
        }

        function renderInstrumentos() {
            const cssInput = isStudentMode ? "pointer-events-none bg-transparent" : "bg-slate-50 focus:bg-white focus:ring-2 focus:border-indigo-300";

            const html = instrumentos.map(inst => `
                <div class="group bg-white p-4 rounded-2xl border border-slate-200 shadow-sm relative">
                    <button onclick="deleteInstrumento('${inst.id}')" class="${isStudentMode ? 'hidden' : ''} absolute top-4 right-4 text-slate-300 hover:text-red-500 hover:bg-red-50 p-1.5 rounded-md transition-colors opacity-0 group-hover:opacity-100">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                    
                    <div class="flex flex-wrap md:flex-nowrap gap-3 mb-4 pr-8">
                        <input type="text" value="${inst.nombre}" oninput="updateInstName('${inst.id}', this.value)" 
                            ${isStudentMode ? 'readonly' : ''}
                            class="flex-grow p-2 rounded-lg text-sm font-bold text-slate-800 border border-transparent outline-none transition-all placeholder-slate-400 ${cssInput}" placeholder="Nombre de la prueba">
                        
                        <div class="flex items-center rounded-lg border border-slate-100 p-1 w-24 flex-shrink-0 ${isStudentMode ? 'bg-transparent border-transparent' : 'bg-slate-50'}">
                            <input type="number" step="1" value="${inst.peso}" oninput="updateInstPeso('${inst.id}', this.value)" 
                                ${isStudentMode ? 'readonly' : ''}
                                class="w-full bg-transparent p-1 text-sm font-semibold text-center text-slate-700 outline-none ${isStudentMode ? 'pointer-events-none' : ''}">
                            <span class="text-xs font-bold text-slate-400 pr-2">%</span>
                        </div>

                        <!-- La NOTA siempre es editable, incluso para alumnos -->
                        <div class="relative w-24 flex-shrink-0">
                            <div class="absolute -top-2 left-2 bg-emerald-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider z-10">Nota</div>
                            <input type="number" min="0" max="10" step="0.1" value="${inst.nota}" oninput="updateInstNota('${inst.id}', this.value)" 
                                class="w-full bg-emerald-50 border border-emerald-200 p-2 rounded-lg text-base font-black text-center text-emerald-700 focus:border-emerald-400 focus:bg-white focus:ring-2 focus:ring-emerald-100 outline-none transition-all pt-3">
                        </div>
                    </div>
                    
                    <div>
                        <div class="text-[10px] uppercase font-bold text-slate-400 mb-2 tracking-wider ml-1">Criterios Evaluados</div>
                        <div class="flex flex-wrap gap-2">
                            ${criterios.map(c => `
                                <label class="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full transition-all duration-200 border ${inst.crits.includes(c.id) ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm shadow-indigo-200' : 'bg-slate-50 text-slate-500 border-slate-200'} ${isStudentMode ? 'cursor-default opacity-80' : 'cursor-pointer hover:bg-slate-100'}">
                                    <input type="checkbox" ${inst.crits.includes(c.id) ? 'checked' : ''} 
                                        ${isStudentMode ? 'disabled' : ''}
                                        onchange="toggleInstCrit('${inst.id}', '${c.id}')" class="hidden">
                                    <span class="font-semibold">${c.nombre || 'Nuevo'}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
            document.getElementById('lista-instrumentos').innerHTML = html;
        }

        // 5. MOTOR MATEMÁTICO (Sin cambios)
        function calcularNotas() {
            const sumaTotalCriterios = criterios.reduce((sum, c) => sum + c.peso, 0);
            document.getElementById('suma-criterios').textContent = sumaTotalCriterios.toFixed(1) + '%';
            
            let techoEvaluado = 0; 
            let puntosConseguidos = 0; 
            let htmlExplicacion = "";

            criterios.forEach(crit => {
                let instAptos = instrumentos.filter(i => 
                    i.crits.includes(crit.id) && i.nota !== '' && i.nota !== null && !isNaN(parseFloat(i.nota))
                );

                if (instAptos.length === 0) {
                    htmlExplicacion += `
                        <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-semibold text-slate-400">CE ${crit.nombre || 'Nuevo'} <span class="text-xs text-slate-500 ml-1">(${crit.peso}%)</span></span>
                                <span class="text-[10px] font-bold text-slate-500 bg-slate-800 px-2 py-1 rounded-md uppercase tracking-wider">Pendiente</span>
                            </div>
                        </div>
                    `;
                    return; 
                }

                let sumaPesosCategorias = instAptos.reduce((acc, i) => acc + i.peso, 0);
                let sumaPonderadaNotas = instAptos.reduce((acc, i) => acc + (parseFloat(i.nota) * i.peso), 0);
                
                let notaCriterio = sumaPonderadaNotas / sumaPesosCategorias;
                techoEvaluado += crit.peso;
                let puntosParaFinal = notaCriterio * crit.peso; 
                puntosConseguidos += puntosParaFinal;

                let desgloseOperacion = instAptos.map(i => 
                    `<span class="text-slate-300">${i.nombre} <span class="text-emerald-400 font-bold">[${parseFloat(i.nota).toFixed(1)}]</span><span class="text-[10px] text-slate-500 ml-1">x${i.peso}%</span></span>`
                ).join(' <span class="text-slate-600 font-bold">+</span> ');

                htmlExplicacion += `
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 relative overflow-hidden group hover:border-indigo-500/50 transition-colors">
                        <div class="absolute top-0 left-0 w-1 h-full ${notaCriterio >= 5 ? 'bg-emerald-500' : 'bg-rose-500'}"></div>
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h4 class="font-bold text-indigo-200">Criterio ${crit.nombre}</h4>
                                <p class="text-[10px] text-slate-400 font-medium">Aporta ${(puntosParaFinal/10).toFixed(2)} pts al total</p>
                            </div>
                            <div class="text-2xl font-black ${notaCriterio >= 5 ? 'text-white' : 'text-rose-400'}">${notaCriterio.toFixed(2)}</div>
                        </div>
                        <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-800/80 text-[11px] font-mono leading-relaxed">
                            <div class="text-slate-500 mb-1 font-sans font-bold text-[10px] uppercase tracking-wider">Fórmula Aplicada</div>
                            <div class="flex flex-col gap-1">
                                <div>( ${desgloseOperacion} )</div>
                                <div class="text-slate-400 border-t border-slate-700 pt-1 mt-1">
                                    ÷ <span class="text-slate-300 font-bold">${sumaPesosCategorias}%</span> (Suma pesos relativos)
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            let notaFinal = 0;
            if (techoEvaluado > 0) notaFinal = puntosConseguidos / techoEvaluado;

            const notaElement = document.getElementById('nota-final');
            notaElement.textContent = techoEvaluado > 0 ? notaFinal.toFixed(2) : '-.--';
            
            if(techoEvaluado > 0 && notaFinal < 5) {
                notaElement.classList.remove('text-white');
                notaElement.classList.add('text-rose-200');
            } else {
                notaElement.classList.add('text-white');
                notaElement.classList.remove('text-rose-200');
            }

            document.getElementById('techo-evaluado').textContent = techoEvaluado.toFixed(1) + '%';
            if (htmlExplicacion === "") htmlExplicacion = `<div class="text-slate-500 text-sm text-center mt-10">Sin datos evaluados.</div>`;
            document.getElementById('explicacion-box').innerHTML = htmlExplicacion;
        }

        // Ejecutar inicialización al cargar
        window.onload = inicializar;
    </script>
</body>
</html>
